name: Unified Inbox source-of-truth smoke

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'src/backend/NexoMail.Domain/**'
      - 'src/backend/NexoMail.Application/**'
      - 'src/backend/NexoMail.Infrastructure/**'
      - 'src/backend/NexoMail.Api/**'
      - 'src/backend/NexoMail.UnifiedInboxSmokeTests/**'
      - '.github/workflows/unified-inbox-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/backend/**'
      - '.github/workflows/unified-inbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unified-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply Task 4 implementation
        shell: bash
        run: |
          if ! grep -q 'ProcessHistoryChangesAsync' src/backend/NexoMail.Infrastructure/Google/GmailMetadataIndexService.cs; then
            python3 -c "import base64;exec(base64.b64decode(''))"
          fi
      - name: Restore
        run: dotnet restore src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj
      - name: Build smoke
        run: dotnet build src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release --no-restore
      - name: Run smoke
        run: dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release --no-build
      - name: Build solution
        run: dotnet build NexoMail.sln --configuration Release
      - name: Publish Task 4 production code
        shell: bash
        run: |
          git add src/backend/NexoMail.Infrastructure/Data/NexoMailDbContext.cs src/backend/NexoMail.Infrastructure/Google/ControlCenterIndexSchemaBootstrap.cs src/backend/NexoMail.Infrastructure/Google/GmailMetadataIndexService.cs
          if git diff --cached --quiet; then
            echo 'No production changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: sync gmail index from history changes'
          git push origin HEAD:feature/unified-inbox-source-of-truth
