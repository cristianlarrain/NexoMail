name: Unified Inbox source-of-truth smoke

on:
  push:
    branches:
      - 'feature/unified-inbox-source-of-truth'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unified-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply Task 5 persistence and Gmail helpers
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/task5.py
          python /tmp/task5.py
      - name: Restore smoke
        run: dotnet restore src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj
      - name: Build smoke
        run: dotnet build src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release --no-restore
      - name: Run smoke
        run: dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release --no-build
      - name: Restore solution
        run: dotnet restore NexoMail.sln
      - name: Build solution
        run: dotnet build NexoMail.sln --configuration Release --no-restore
      - name: Publish Task 5 product patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/backend/NexoMail.Infrastructure/Data/NexoMailDbContext.cs src/backend/NexoMail.Infrastructure/Google/GmailMetadataIndexService.cs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: support gmail index reconciliation'
          git push origin HEAD:feature/unified-inbox-source-of-truth
