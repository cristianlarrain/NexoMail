name: Task 9 invariants v3

on:
  push:
    branches:
      - feature/task9-unified-inbox-invariants
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Apply Task 9 invariant tests
        run: python scripts/task9_apply.py
      - name: Build solution
        run: dotnet build NexoMail.sln --configuration Release
      - name: Unified Inbox smoke
        run: dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release
      - name: Control Center smoke
        run: dotnet run --project src/backend/NexoMail.ControlCenterSmokeTests/NexoMail.ControlCenterSmokeTests.csproj --configuration Release
      - name: Intelligence smoke
        run: dotnet run --project src/backend/NexoMail.IntelligenceSmokeTests/NexoMail.IntelligenceSmokeTests.csproj --configuration Release
      - name: Commercial smoke
        run: dotnet run --project src/backend/NexoMail.CommercialSmokeTests/NexoMail.CommercialSmokeTests.csproj --configuration Release
      - name: General backend smoke
        run: dotnet run --project src/backend/NexoMail.SmokeTests/NexoMail.SmokeTests.csproj --configuration Release
      - name: Unified inbox source smoke
        run: node src/frontend/scripts/unified-inbox-source-smoke.mjs
      - name: Unified inbox readiness smoke
        run: node src/frontend/scripts/unified-inbox-readiness-smoke.mjs
      - name: Install frontend
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        working-directory: src/frontend
        run: pnpm build
      - name: Verify indexed read boundaries
        shell: bash
        run: |
          grep -q "UnifiedInboxQueryService" src/backend/NexoMail.Api/Program.cs
          grep -q "MailMessageIndex" src/backend/NexoMail.Infrastructure/Google/GmailControlCenterService.cs
          grep -q "MailMessageIndex" src/backend/NexoMail.Infrastructure/Intelligence/LocalIndexCommunicationIntelligenceReader.cs
      - name: Commit Task 9 invariant tests
        shell: bash
        run: |
          if git diff --quiet -- src/backend/NexoMail.UnifiedInboxSmokeTests/Program.cs src/backend/NexoMail.UnifiedInboxSmokeTests/GmailReconciliationSmoke.cs src/backend/NexoMail.ControlCenterSmokeTests/Program.cs src/backend/NexoMail.IntelligenceSmokeTests/Program.cs; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/NexoMail.UnifiedInboxSmokeTests/Program.cs src/backend/NexoMail.UnifiedInboxSmokeTests/GmailReconciliationSmoke.cs src/backend/NexoMail.ControlCenterSmokeTests/Program.cs src/backend/NexoMail.IntelligenceSmokeTests/Program.cs
          git commit -m "test: enforce unified mail source invariants"
          git push origin HEAD:feature/task9-unified-inbox-invariants
