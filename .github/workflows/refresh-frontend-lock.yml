name: Refresh frontend lockfile

on:
  push:
    branches:
      - feature/commercial-foundation
    paths:
      - src/frontend/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/commercial-foundation

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Refresh lockfile
        working-directory: src/frontend
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          if git diff --quiet -- src/frontend/pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/pnpm-lock.yaml
          git commit -m "chore: refresh frontend lockfile"
          git push origin HEAD:feature/commercial-foundation
