name: Frontend build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify sidebar tooltips
        run: node scripts/sidebar-tooltip-smoke.mjs

      - name: Verify commercial feature gates
        run: node scripts/commercial-entitlement-smoke.mjs

      - name: Verify admin user plan management
        run: node scripts/admin-users-smoke.mjs

      - name: Verify Nexi usage admin panel
        run: node scripts/ai-usage-admin-smoke.mjs

      - name: Verify registration legal consent
        run: node scripts/legal-consent-smoke.mjs

      - name: Build frontend
        run: pnpm build
