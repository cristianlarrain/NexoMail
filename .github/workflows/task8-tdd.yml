name: Task 8 TDD

on:
  push:
    branches:
      - feature/task8-unified-priority
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unified inbox source smoke
        run: node src/frontend/scripts/unified-inbox-source-smoke.mjs
