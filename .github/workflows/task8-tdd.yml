name: Task 8 TDD

on:
  push:
    branches:
      - feature/task8-unified-priority
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Apply Task 8 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mail_api_path = Path('src/frontend/src/api/mailApi.ts')
          mail_api = mail_api_path.read_text(encoding='utf-8')
          if '  resolveMessages:' not in mail_api:
              marker = "  message: async (accountId: string, messageId: string) => {"
              if marker not in mail_api:
                  raise SystemExit('No se encontró el punto de inserción de resolveMessages en mailApi.ts')
              resolve_block = """  resolveMessages: (references: Array<{ accountId: string; providerMessageId: string }>) =>
            api<MailSummary[]>('/mail/messages/resolve', {
              method: 'POST',
              body: JSON.stringify(references),
            }),
          """
              mail_api = mail_api.replace(marker, resolve_block + marker, 1)
              mail_api_path.write_text(mail_api, encoding='utf-8')

          inbox_path = Path('src/frontend/src/pages/InboxPage.tsx')
          inbox = inbox_path.read_text(encoding='utf-8')
          if 'mailApi.resolveMessages' not in inbox:
              old_refresh = "if (priorityOnly) await Promise.all([prioritySnapshot.refetch(), trackedItemsQuery.refetch()])"
              new_refresh = """if (priorityOnly) await Promise.all([
                  prioritySnapshot.refetch(),
                  trackedItemsQuery.refetch(),
                  queryClient.invalidateQueries({ queryKey: ['priority-messages', accountId], refetchType: 'active' }),
                ])"""
              if old_refresh not in inbox:
                  raise SystemExit('No se encontró el refresco prioritario esperado en InboxPage.tsx')
              inbox = inbox.replace(old_refresh, new_refresh, 1)

              start_marker = "  const priorityReferenceByKey = useMemo(() => new Map(priorityReferences.map(item => [pendingKey(item), item])), [priorityReferences])"
              end_marker = "  }, [items, priorityHidden, priorityOnly, priorityReferences, search])"
              start = inbox.find(start_marker)
              if start < 0:
                  raise SystemExit('No se encontró el inicio del bloque prioritario en InboxPage.tsx')
              end = inbox.find(end_marker, start)
              if end < 0:
                  raise SystemExit('No se encontró el final del bloque prioritario en InboxPage.tsx')
              end += len(end_marker)
              priority_block = """  const priorityReferenceByKey = useMemo(() => new Map(priorityReferences.map(item => [pendingKey(item), item])), [priorityReferences])

            const priorityMessageReferences = useMemo(() => priorityReferences.map(reference => ({
              accountId: reference.accountId,
              providerMessageId: reference.messageId,
            })), [priorityReferences])

            const priorityMessagesQuery = useQuery({
              queryKey: ['priority-messages', accountId, priorityMessageReferences],
              queryFn: () => mailApi.resolveMessages(priorityMessageReferences),
              enabled: priorityOnly && priorityMessageReferences.length > 0,
              staleTime: 30_000,
              refetchOnMount: 'always',
              refetchOnWindowFocus: false,
            })

            const displayItems = useMemo(() => {
              if (!priorityOnly) return items
              const normalizedSearch = search.trim().toLowerCase()
              return (priorityMessagesQuery.data ?? [])
                .filter(item => !priorityHidden.has(itemKey(item)))
                .filter(item => !normalizedSearch || normalizedSearch === 'is:unread' || `${item.senderName} ${item.senderAddress} ${item.subject} ${item.preview}`.toLowerCase().includes(normalizedSearch))
            }, [items, priorityHidden, priorityMessagesQuery.data, priorityOnly, search])"""
              inbox = inbox[:start] + priority_block + inbox[end:]

              old_loading = "  const priorityLoading = priorityOnly && (prioritySnapshot.isLoading || trackedItemsQuery.isLoading)"
              new_loading = """  const priorityLoading = priorityOnly && (
              prioritySnapshot.isLoading ||
              trackedItemsQuery.isLoading ||
              (priorityReferences.length > 0 && priorityMessagesQuery.isLoading)
            )"""
              old_error = "  const priorityError = priorityOnly && (prioritySnapshot.isError || trackedItemsQuery.isError)"
              new_error = "  const priorityError = priorityOnly && (prioritySnapshot.isError || trackedItemsQuery.isError || priorityMessagesQuery.isError)"
              if old_loading not in inbox or old_error not in inbox:
                  raise SystemExit('No se encontró el estado de carga/error prioritario esperado en InboxPage.tsx')
              inbox = inbox.replace(old_loading, new_loading, 1).replace(old_error, new_error, 1)
              inbox_path.write_text(inbox, encoding='utf-8')
          PY

      - name: Unified inbox source smoke
        run: node src/frontend/scripts/unified-inbox-source-smoke.mjs

      - name: Unified inbox readiness smoke
        run: node src/frontend/scripts/unified-inbox-readiness-smoke.mjs

      - name: Install frontend
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: src/frontend
        run: pnpm build

      - name: Commit Task 8
        shell: bash
        run: |
          if git diff --quiet -- src/frontend/src/api/mailApi.ts src/frontend/src/pages/InboxPage.tsx; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/api/mailApi.ts src/frontend/src/pages/InboxPage.tsx
          git commit -m "refactor: resolve priority mail from unified index"
          git push origin HEAD:feature/task8-unified-priority
