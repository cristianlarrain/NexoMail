name: Task 9 invariants

on:
  push:
    branches:
      - feature/task9-unified-inbox-invariants
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Apply Task 9 invariant tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Unified Inbox: a persisted provider error must not hide indexed mail.
          path = Path('src/backend/NexoMail.UnifiedInboxSmokeTests/Program.cs')
          text = path.read_text(encoding='utf-8')
          marker = 'await GmailBackfillSmoke.RunAsync(ct);'
          if 'provider outage state must not hide indexed mail' not in text:
              block = '''// provider outage state must not hide indexed mail from the ordinary indexed read path.\ndb.MailIndexStates.Add(new MailIndexStateEntity\n{\n    AccountId = accountA,\n    UserId = userId,\n    LastIndexedAt = now,\n    LastSyncAttemptAt = now,\n    LastSyncErrorCode = "sync_error",\n    WindowDays = 90,\n    IndexedMessageCount = await db.MailMessageIndex.CountAsync(x => x.UserId == userId && x.AccountId == accountA, ct),\n});\nawait db.SaveChangesAsync(ct);\nvar outagePage = await service.GetMessagesAsync(new MailQuery(null, "inbox", 20), ct);\nEnsure(outagePage.Items.Any(x => x.AccountId == accountA && x.ProviderMessageId == "a-inbox-1"),\n    "Un fallo del proveedor no puede ocultar correo ya indexado de la Bandeja Unificada.");\n\n'''
              if marker not in text:
                  raise SystemExit('UnifiedInbox marker not found')
              path.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          # Control Center: every pending item must exist in the index, and partial provider failure must preserve indexed mail.
          path = Path('src/backend/NexoMail.ControlCenterSmokeTests/Program.cs')
          text = path.read_text(encoding='utf-8')
          if 'using NexoMail.Infrastructure.Mail;' not in text:
              text = text.replace('using NexoMail.Infrastructure.Google;\n', 'using NexoMail.Infrastructure.Google;\nusing NexoMail.Infrastructure.Mail;\n', 1)
          marker = 'Ensure(initialSnapshot.PendingItems.Count == 2, "Los avisos transaccionales y los no leídos antiguos no deben entrar como pendientes operacionales.");'
          if 'Control Center referencia un mensaje inexistente en el índice' not in text:
              block = '''\nforeach (var item in initialSnapshot.PendingItems)\n{\n    Ensure(await database.MailMessageIndex.AsNoTracking().AnyAsync(x =>\n            x.UserId == userId &&\n            x.AccountId == item.AccountId &&\n            x.ProviderMessageId == item.MessageId, cancellationToken),\n        $"Control Center referencia un mensaje inexistente en el índice: {item.AccountId}/{item.MessageId}");\n}'''
              if marker not in text:
                  raise SystemExit('ControlCenter pending marker not found')
              text = text.replace(marker, marker + block, 1)

          marker = 'var isolationFactory = new FaultIsolationSyncHttpClientFactory();'
          if 'broken-kept-1' not in text:
              block = '''database.MailIndexStates.Add(new MailIndexStateEntity\n{\n    AccountId = brokenAccountId,\n    UserId = userId,\n    LastIndexedAt = now,\n    LastSyncAttemptAt = now.AddMinutes(-10),\n    WindowDays = 90,\n    IndexedMessageCount = 1,\n    BackfillStartedAt = now.AddMinutes(-20),\n    BackfillCompletedAt = now.AddMinutes(-15),\n    GmailHistoryId = "broken-history",\n});\ndatabase.MailMessageIndex.Add(new MailMessageIndexEntity\n{\n    Id = Guid.NewGuid(), UserId = userId, AccountId = brokenAccountId, ProviderMessageId = "broken-kept-1", ThreadId = "broken-thread-1",\n    Direction = "received", FromName = "Persisted", FromAddress = "persisted@nexomail.test", ToAddresses = $"Cristian\\t{ownAddress}",\n    Subject = "Debe sobrevivir al fallo OAuth", Snippet = "indexed before outage", OccurredAt = now.AddMinutes(-3), IndexedAt = now,\n    GmailLabels = "INBOX,UNREAD", IsInbox = true, IsUnread = true,\n});\nawait database.SaveChangesAsync(cancellationToken);\n\nvar indexedInbox = new UnifiedInboxQueryService(database, userContext);\nvar beforeIsolationFailure = await indexedInbox.GetMessagesAsync(new MailQuery(null, "inbox", 100), cancellationToken);\nEnsure(beforeIsolationFailure.Items.Any(x => x.AccountId == brokenAccountId && x.ProviderMessageId == "broken-kept-1"),\n    "La prueba de aislamiento debe comenzar con correo previamente indexado en la cuenta que fallará.");\n\n'''
              if marker not in text:
                  raise SystemExit('ControlCenter isolation marker not found')
              text = text.replace(marker, block + marker, 1)

          marker = 'Ensure(isolationFactory.RefreshTokensSeen.Contains("refresh-token"), "La cuenta Gmail válida no se sincronizó después del fallo de otra cuenta.");'
          if 'La cuenta con fallo OAuth perdió correo previamente indexado' not in text:
              block = '''\ndatabase.ChangeTracker.Clear();\nvar afterIsolationFailure = await indexedInbox.GetMessagesAsync(new MailQuery(null, "inbox", 100), cancellationToken);\nEnsure(afterIsolationFailure.Items.Any(x => x.AccountId == brokenAccountId && x.ProviderMessageId == "broken-kept-1"),\n    "La cuenta con fallo OAuth perdió correo previamente indexado.");\nvar brokenState = await database.MailIndexStates.AsNoTracking().SingleAsync(x => x.AccountId == brokenAccountId, cancellationToken);\nvar healthyState = await database.MailIndexStates.AsNoTracking().SingleAsync(x => x.AccountId == accountId, cancellationToken);\nEnsure(!string.IsNullOrWhiteSpace(brokenState.LastSyncErrorCode),\n    "El fallo OAuth debe quedar expuesto en LastSyncErrorCode sin borrar el índice.");\nEnsure(string.IsNullOrWhiteSpace(healthyState.LastSyncErrorCode),\n    "El fallo de una cuenta no puede contaminar el estado de sincronización de la cuenta sana.");\nEnsure(healthyState.LastSyncAttemptAt is not null && healthyState.LastSyncAttemptAt >= leaseState.LastSyncAttemptAt,\n    "La cuenta sana debe seguir avanzando su estado de sincronización aunque otra cuenta falle.");'''
              if marker not in text:
                  raise SystemExit('ControlCenter isolation assertion marker not found')
              text = text.replace(marker, marker + block, 1)
          path.write_text(text, encoding='utf-8')

          # Intelligence: prove each snapshot is backed by a real indexed row and the expected account/thread identity.
          path = Path('src/backend/NexoMail.IntelligenceSmokeTests/Program.cs')
          text = path.read_text(encoding='utf-8')
          required_usings = [
              'using Microsoft.Data.Sqlite;',
              'using Microsoft.EntityFrameworkCore;',
              'using NexoMail.Domain;',
              'using NexoMail.Infrastructure.Data;',
          ]
          for using in reversed(required_usings):
              if using not in text:
                  text = using + '\n' + text
          marker = 'Console.WriteLine("Nexo Intelligence actionability, state and priority smoke tests passed.");'
          if 'Nexo Intelligence produjo una conversación sin respaldo en MailMessageIndex' not in text:
              block = '''var indexedUserId = Guid.NewGuid();\nvar indexedAccountId = Guid.NewGuid();\nawait using var indexedConnection = new SqliteConnection("Data Source=:memory:");\nawait indexedConnection.OpenAsync();\nvar indexedOptions = new DbContextOptionsBuilder<NexoMailDbContext>().UseSqlite(indexedConnection).Options;\nawait using var indexedDatabase = new NexoMailDbContext(indexedOptions);\nawait indexedDatabase.Database.EnsureCreatedAsync();\nindexedDatabase.Users.Add(new UserEntity\n{\n    Id = indexedUserId, DisplayName = "Indexed Intelligence", Email = "user@example.test", CreatedAt = now, IsActive = true, IsEmailVerified = true,\n});\nindexedDatabase.MailAccounts.Add(new MailAccountEntity\n{\n    Id = indexedAccountId, UserId = indexedUserId, Provider = MailProviderType.Gmail, EmailAddress = "user@example.test",\n    DisplayName = "Indexed Gmail", IsActive = true, CreatedAt = now,\n});\nindexedDatabase.MailMessageIndex.AddRange(\n    new MailMessageIndexEntity\n    {\n        Id = Guid.NewGuid(), UserId = indexedUserId, AccountId = indexedAccountId, ProviderMessageId = "intel-received-1", ThreadId = "intel-thread",\n        Direction = "received", FromName = "External", FromAddress = "external@example.test", ToAddresses = "User\\tuser@example.test",\n        Subject = "Indexed conversation", Snippet = "Need review", OccurredAt = now.AddMinutes(-20), IndexedAt = now, IsInbox = true, IsUnread = true,\n    },\n    new MailMessageIndexEntity\n    {\n        Id = Guid.NewGuid(), UserId = indexedUserId, AccountId = indexedAccountId, ProviderMessageId = "intel-sent-1", ThreadId = "intel-thread",\n        Direction = "sent", FromName = "User", FromAddress = "user@example.test", ToAddresses = "External\\texternal@example.test",\n        Subject = "Re: Indexed conversation", Snippet = "Following up", OccurredAt = now.AddMinutes(-5), IndexedAt = now, IsSent = true,\n    });\nawait indexedDatabase.SaveChangesAsync();\n\nvar indexedIntelligence = new CommunicationIntelligenceService(analyzer, resolver, scorer);\nvar indexedReader = new LocalIndexCommunicationIntelligenceReader(\n    indexedDatabase,\n    new IndexedTestUserContext(indexedUserId),\n    new MailMessageIndexConversationAdapter(),\n    indexedIntelligence);\nvar indexedSnapshots = await indexedReader.AnalyzeAsync(now);\nEnsure(indexedSnapshots.Count == 1, "La lectura Intelligence debe producir exactamente la conversación indexada de prueba.");\nforeach (var snapshot in indexedSnapshots)\n{\n    var source = await indexedDatabase.MailMessageIndex.AsNoTracking().SingleOrDefaultAsync(x =>\n        x.UserId == indexedUserId &&\n        x.AccountId == snapshot.AccountId &&\n        x.ProviderMessageId == snapshot.LatestMessageId);\n    Ensure(source is not null,\n        $"Nexo Intelligence produjo una conversación sin respaldo en MailMessageIndex: {snapshot.AccountId}/{snapshot.LatestMessageId}");\n    Ensure(snapshot.ConversationId == $"{snapshot.AccountId:N}:{source!.ThreadId}",\n        "La identidad de conversación Intelligence debe derivar del mismo AccountId/ThreadId indexado.");\n}\n\n'''
              if marker not in text:
                  raise SystemExit('Intelligence marker not found')
              text = text.replace(marker, block + marker, 1)
              text += '''\n\nsealed class IndexedTestUserContext(Guid userId) : IUserContext\n{\n    public bool IsAuthenticated => true;\n    public Guid UserId { get; } = userId;\n    public string Email => "user@example.test";\n    public string DisplayName => "Indexed Intelligence";\n}\n'''
          path.write_text(text, encoding='utf-8')

          # Reconciliation: after a provider-confirmed orphan is removed, prove exact healthy parity.
          path = Path('src/backend/NexoMail.UnifiedInboxSmokeTests/GmailReconciliationSmoke.cs')
          text = path.read_text(encoding='utf-8')
          marker = 'Ensure(await database.MailMessageIndex.AsNoTracking().AnyAsync(x => x.AccountId == accountId && x.ProviderMessageId == "ORPHAN", ct), "ORPHAN debe conservarse hasta una eliminación confirmada por el proveedor.");'
          if 'La paridad final proveedor/índice debe quedar saludable' not in text:
              block = '''\n\n        var confirmedDeletedOrphan = await database.MailMessageIndex.SingleAsync(\n            x => x.AccountId == accountId && x.ProviderMessageId == "ORPHAN", ct);\n        database.MailMessageIndex.Remove(confirmedDeletedOrphan);\n        await database.SaveChangesAsync(ct);\n        var healthy = await service.ReconcileAsync(accountId, repairMissing: false, ct);\n        Ensure(healthy.MissingProviderIds.Count == 0, "La paridad final no puede dejar mensajes faltantes.");\n        Ensure(healthy.DuplicateIndexedIds == 0, "La paridad final no puede contener duplicados.");\n        Ensure(healthy.OrphanIndexedIds.Count == 0, "La paridad final no puede contener huérfanos no explicados.");\n        Ensure(healthy.IsHealthy, "La paridad final proveedor/índice debe quedar saludable.");'''
              if marker not in text:
                  raise SystemExit('Reconciliation marker not found')
              path.write_text(text.replace(marker, marker + block, 1), encoding='utf-8')
          PY

      - name: Build solution
        run: dotnet build NexoMail.sln --configuration Release

      - name: Unified Inbox smoke
        run: dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release

      - name: Control Center smoke
        run: dotnet run --project src/backend/NexoMail.ControlCenterSmokeTests/NexoMail.ControlCenterSmokeTests.csproj --configuration Release

      - name: Intelligence smoke
        run: dotnet run --project src/backend/NexoMail.IntelligenceSmokeTests/NexoMail.IntelligenceSmokeTests.csproj --configuration Release

      - name: Commercial smoke
        run: dotnet run --project src/backend/NexoMail.CommercialSmokeTests/NexoMail.CommercialSmokeTests.csproj --configuration Release

      - name: General backend smoke
        run: dotnet run --project src/backend/NexoMail.SmokeTests/NexoMail.SmokeTests.csproj --configuration Release

      - name: Unified inbox source smoke
        run: node src/frontend/scripts/unified-inbox-source-smoke.mjs

      - name: Unified inbox readiness smoke
        run: node src/frontend/scripts/unified-inbox-readiness-smoke.mjs

      - name: Install frontend
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        working-directory: src/frontend
        run: pnpm build

      - name: Verify indexed read boundaries
        shell: bash
        run: |
          grep -q "UnifiedInboxQueryService" src/backend/NexoMail.Api/Program.cs
          grep -q "MailMessageIndex" src/backend/NexoMail.Infrastructure/Google/GmailControlCenterService.cs
          grep -q "MailMessageIndex" src/backend/NexoMail.Infrastructure/Intelligence/LocalIndexCommunicationIntelligenceReader.cs

      - name: Commit Task 9 invariant tests
        shell: bash
        run: |
          if git diff --quiet -- src/backend/NexoMail.UnifiedInboxSmokeTests/Program.cs src/backend/NexoMail.UnifiedInboxSmokeTests/GmailReconciliationSmoke.cs src/backend/NexoMail.ControlCenterSmokeTests/Program.cs src/backend/NexoMail.IntelligenceSmokeTests/Program.cs; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/NexoMail.UnifiedInboxSmokeTests/Program.cs src/backend/NexoMail.UnifiedInboxSmokeTests/GmailReconciliationSmoke.cs src/backend/NexoMail.ControlCenterSmokeTests/Program.cs src/backend/NexoMail.IntelligenceSmokeTests/Program.cs
          git commit -m "test: enforce unified mail source invariants"
          git push origin HEAD:feature/task9-unified-inbox-invariants
