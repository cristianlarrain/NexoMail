name: Fix Gmail history checkpoint regression

on:
  push:
    branches:
      - feature/unified-inbox-source-of-truth
    paths:
      - .github/workflows/fix-gmail-history-checkpoint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-history-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/unified-inbox-source-of-truth

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/backend/NexoMail.UnifiedInboxSmokeTests/GmailBackfillSmoke.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'EnsureBackfill(state1.GmailHistoryId == "500", "El primer ciclo debe capturar History antes de avanzar el backfill para cerrar la ventana de carrera.");':
              'EnsureBackfill(state1.GmailHistoryId is null, "Durante un backfill incompleto no debe persistirse un checkpoint History que pueda expirar antes de completar el barrido.");',
              'EnsureBackfill(state2.GmailHistoryId == "500", "El checkpoint History inicial debe conservarse durante todo el backfill.");':
              'EnsureBackfill(state2.GmailHistoryId is null, "El checkpoint History debe seguir vacío hasta completar la última página del backfill.");',
              'EnsureBackfill(state3.GmailHistoryId == "500", "Un History vacío debe mantener el checkpoint capturado al inicio.");':
              'EnsureBackfill(state3.GmailHistoryId == "500", "Al completar el backfill debe persistirse un checkpoint History fresco.");',
              'EnsureBackfill(factory.ProfileCalls == 1, "El checkpoint History inicial debe capturarse una sola vez.");':
              'EnsureBackfill(factory.ProfileCalls == 1, "El checkpoint History debe capturarse una sola vez y únicamente al completar el backfill.");'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'No se encontró patrón esperado: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Restore unified inbox smoke
        run: dotnet restore src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj

      - name: Verify RED
        shell: bash
        run: |
          set +e
          dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release > red.log 2>&1
          code=$?
          cat red.log
          if [ "$code" -eq 0 ]; then
            echo "ERROR: el test de regresión pasó antes de la corrección."
            exit 1
          fi
          grep -q "Durante un backfill incompleto no debe persistirse" red.log || {
            echo "ERROR: RED falló por una causa distinta a la regresión esperada."
            exit 1
          }
          echo "RED confirmado: el código actual persiste GmailHistoryId antes de completar el backfill."

      - name: Apply minimal production fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/backend/NexoMail.Infrastructure/Google/GmailMetadataIndexService.cs')
          text = path.read_text(encoding='utf-8')
          old_start = '''        if (string.IsNullOrWhiteSpace(state.GmailHistoryId))
          {
              state.GmailHistoryId = await GetProfileHistoryIdAsync(client, cancellationToken);
              state.BackfillStartedAt ??= now;
              await database.SaveChangesAsync(cancellationToken);
          }
          '''
          new_start = '''        if (!state.BackfillStartedAt.HasValue)
          {
              state.BackfillStartedAt = now;
              state.GmailHistoryId = null;
              await database.SaveChangesAsync(cancellationToken);
          }
          else if (!string.IsNullOrWhiteSpace(state.GmailHistoryId))
          {
              // Older builds persisted a History checkpoint at backfill start. It is not safe
              // to reuse after a multi-cycle backfill because Gmail may expire it meanwhile.
              state.GmailHistoryId = null;
              await database.SaveChangesAsync(cancellationToken);
          }
          '''
          old_finish = '''        state.BackfillStartedAt ??= now;
          state.BackfillPageToken = page.NextPageToken;
          if (string.IsNullOrWhiteSpace(page.NextPageToken))
              state.BackfillCompletedAt = now;
          await database.SaveChangesAsync(cancellationToken);
          '''
          new_finish = '''        state.BackfillStartedAt ??= now;
          state.BackfillPageToken = page.NextPageToken;
          if (string.IsNullOrWhiteSpace(page.NextPageToken))
          {
              // Capture a fresh checkpoint only when the complete provider-visible mailbox
              // has been indexed, so the incremental History phase cannot start from a stale id.
              state.GmailHistoryId = await GetProfileHistoryIdAsync(client, cancellationToken);
              state.BackfillCompletedAt = now;
          }
          await database.SaveChangesAsync(cancellationToken);
          '''
          if old_start not in text:
              raise SystemExit('No se encontró el bloque inicial de History esperado.')
          if old_finish not in text:
              raise SystemExit('No se encontró el bloque final de backfill esperado.')
          text = text.replace(old_start, new_start).replace(old_finish, new_finish)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify GREEN unified inbox smoke
        run: dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release

      - name: Restore full solution
        run: dotnet restore NexoMail.sln

      - name: Build full solution
        run: dotnet build NexoMail.sln --configuration Release --no-restore

      - name: Run Control Center smoke
        run: dotnet run --project src/backend/NexoMail.ControlCenterSmokeTests/NexoMail.ControlCenterSmokeTests.csproj --configuration Release

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/NexoMail.UnifiedInboxSmokeTests/GmailBackfillSmoke.cs src/backend/NexoMail.Infrastructure/Google/GmailMetadataIndexService.cs
          git commit -m "fix: capture gmail history checkpoint after backfill"
          git push origin HEAD:feature/unified-inbox-source-of-truth
