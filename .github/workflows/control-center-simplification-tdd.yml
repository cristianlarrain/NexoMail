name: Control Center simplification TDD

on:
  push:
    branches:
      - feature/control-center-simplification
  workflow_dispatch:

jobs:
  red-green:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/control-center-simplification

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: RED simplification smoke
        id: red
        working-directory: src/frontend
        shell: bash
        run: |
          set +e
          node scripts/control-center-simplification-smoke.mjs > /tmp/red.log 2>&1
          code=$?
          cat /tmp/red.log
          if [ "$code" -eq 0 ]; then
            echo "Smoke unexpectedly passed before implementation."
            exit 1
          fi
          echo "Expected RED confirmed."

      - name: Apply simplification
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('src/frontend/src/layouts/AppLayout.tsx')
          text = app.read_text(encoding='utf-8')
          text = text.replace(', Clock3,', ',')
          text = text.replace("import { WeatherWidget } from '../components/WeatherWidget'\n", '')
          text = re.sub(r"\nfunction capitalize\(value: string\) \{[^\n]+\}\n", "\n", text)
          text = text.replace("  const [now, setNow] = useState(() => new Date())\n", '')
          text = re.sub(r"\n  useEffect\(\(\) => \{ const timer = window\.setInterval\(\(\) => setNow\(new Date\(\)\), 1000\); return \(\) => window\.clearInterval\(timer\) \}, \[\]\)\n", "\n", text)
          text = re.sub(r"\n  const dateLabel = .*?\n  const timeLabel = .*?\n", "\n", text)
          text = re.sub(r"\n        <div className=\"operations-clock\"[^\n]*</div>", "", text)
          text = re.sub(r"\n        <WeatherWidget[^\n]*/>", "", text)
          app.write_text(text, encoding='utf-8')

          page = Path('src/frontend/src/pages/ControlCenterPage.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace('BarChart3, Files, Gauge, Inbox, LockKeyhole, Sparkles, Users', 'BarChart3, Files, Gauge, LockKeyhole, Sparkles, Users')
          text = re.sub(r"\n      <Link to=\{accountId \? `/account/\$\{encodeURIComponent\(accountId\)\}` : '/inbox'\} className=\"secondary-button control-classic-link\"><Inbox size=\{15\} /> Vista clásica</Link>", "", text)
          page.write_text(text, encoding='utf-8')

          queue = Path('src/frontend/src/components/NexiPriorityQueue.tsx')
          text = queue.read_text(encoding='utf-8')
          text = text.replace("import { useMutation } from '@tanstack/react-query'\n", '')
          text = text.replace('BellOff, Check, CheckCircle2, ChevronRight, CircleHelp, Clock3, Eye, Info, MailOpen, MessageSquareReply, MoreHorizontal, Sparkles, TimerReset, Trash2, X', 'BellOff, Check, CheckCircle2, ChevronRight, Clock3, Eye, Info, MessageSquareReply, MoreHorizontal, Sparkles, TimerReset, Trash2, X')
          text = text.replace('  classifyFromInsight,\n', '')
          text = text.replace('  type NexiPriorityClassification,\n', '')
          text = text.replace("  const [semantic, setSemantic] = useState<Record<string, NexiPriorityClassification>>({})\n", '')
          text = text.replace('    const original = semantic[key] ?? classifyByRules(entry)\n', '    const original = classifyByRules(entry)\n')
          text = text.replace('  }), [items, semantic, suppressedUrgency])\n', '  }), [items, suppressedUrgency])\n')
          text = re.sub(r"\n  const counts = useMemo\(\(\) => focused\.reduce\([\s\S]*?\), \[focused\]\)\n", "\n", text, count=1)
          text = re.sub(r"\n  const candidates = useMemo\([\s\S]*?\n  \}\)\n", "\n", text, count=1)
          text = re.sub(r"\n  function selectPriorityFilter\([\s\S]*?\n  \}\n", "\n", text, count=1)
          text = re.sub(r"\n      \{items\.length > 0 && <button type=\"button\" className=\"secondary-button nexi-priority-refine nexi-glow-action\"[\s\S]*?</button>\}", "", text, count=1)
          text = re.sub(r"\n    <div className=\"nexi-priority-summary\" aria-label=\"Filtros de priorización\">[\s\S]*?</div>\n", "\n", text, count=1)
          text = re.sub(r"<span>Mostrando \{Math\.min\(visible, filtered\.length\)\} de \{filtered\.length\}\{Object\.keys\(semantic\)\.length > 0 \? ` · \$\{Object\.keys\(semantic\)\.length\} revisados por Nexi` : ''\}</span>", '<span>Mostrando {Math.min(visible, filtered.length)} de {filtered.length}</span>', text)
          text = re.sub(r"\n      \{candidates\.length > 0 && !refine\.isPending && <small>Nexi revisa hasta 5 correos por tanda\.</small>\}", "", text)
          queue.write_text(text, encoding='utf-8')

      - name: GREEN simplification smoke
        working-directory: src/frontend
        run: node scripts/control-center-simplification-smoke.mjs

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: src/frontend
        run: pnpm build

      - name: Existing Control Center smoke
        working-directory: src/frontend
        run: node scripts/control-center-summary-smoke.mjs

      - name: Commit product change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src/layouts/AppLayout.tsx src/frontend/src/pages/ControlCenterPage.tsx src/frontend/src/components/NexiPriorityQueue.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor: simplify Nexi control center chrome"
          git push origin HEAD:feature/control-center-simplification
