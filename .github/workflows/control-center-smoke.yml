name: Control center smoke test

on:
  push:
    branches:
      - feature/nexi-assistant
  workflow_dispatch:

jobs:
  control-center:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend smoke test
        run: dotnet restore src/backend/NexoMail.ControlCenterSmokeTests/NexoMail.ControlCenterSmokeTests.csproj

      - name: Build backend smoke test
        id: backend-build
        shell: bash
        run: |
          set +e
          dotnet build src/backend/NexoMail.ControlCenterSmokeTests/NexoMail.ControlCenterSmokeTests.csproj --configuration Release --no-restore 2>&1 | tee control-center-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backend build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-build-log
          path: control-center-build.log
          if-no-files-found: ignore

      - name: Fail if backend build failed
        if: steps.backend-build.outputs.status != '0'
        run: exit 1

      - name: Run control center smoke test
        run: dotnet run --project src/backend/NexoMail.ControlCenterSmokeTests/NexoMail.ControlCenterSmokeTests.csproj --configuration Release --no-build

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: src/frontend
        run: pnpm build
