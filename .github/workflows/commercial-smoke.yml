name: Commercial subscription smoke test

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  commercial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore commercial smoke test
        run: dotnet restore src/backend/NexoMail.CommercialSmokeTests/NexoMail.CommercialSmokeTests.csproj

      - name: Build commercial smoke test
        run: dotnet build src/backend/NexoMail.CommercialSmokeTests/NexoMail.CommercialSmokeTests.csproj --no-restore --configuration Release

      - name: Run commercial smoke test
        run: dotnet run --project src/backend/NexoMail.CommercialSmokeTests/NexoMail.CommercialSmokeTests.csproj --no-build --configuration Release
