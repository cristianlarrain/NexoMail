name: Point1 Task2 add solution project

on:
  push:
    branches:
      - feature/unified-inbox-source-of-truth
    paths:
      - '.github/workflows/point1-task2-add-solution.yml'

permissions:
  contents: write

jobs:
  add-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Add Unified Inbox smoke project to solution
        run: dotnet sln NexoMail.sln add src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj
      - name: Verify complete solution
        run: dotnet build NexoMail.sln --configuration Release
      - name: Verify Unified Inbox smoke
        run: dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release --no-build
      - name: Commit solution registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/point1-task2-add-solution.yml
          git add NexoMail.sln
          git commit -m "test: register unified inbox smoke project"
          git push origin HEAD:feature/unified-inbox-source-of-truth
