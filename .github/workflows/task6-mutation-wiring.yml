name: Task 6 mutation wiring

on:
  push:
    branches:
      - 'feature/unified-inbox-source-of-truth'
    paths:
      - '.github/workflows/task6-mutation-wiring.yml'

permissions:
  contents: write

jobs:
  wire-task6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Wire mutation convergence after provider success
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          program = 'src/backend/NexoMail.Api/Program.cs'
          replace_once(program,
              'using NexoMail.Infrastructure.Intelligence;\n',
              'using NexoMail.Infrastructure.Intelligence;\nusing NexoMail.Infrastructure.Mail;\n')
          replace_once(program,
              'builder.Services.AddScoped<GmailControlCenterActivityService>();\nMailProviderBetaModule.AddServices(builder.Services, builder.Configuration);',
              'builder.Services.AddScoped<GmailControlCenterActivityService>();\nbuilder.Services.AddScoped<MailIndexMutationService>();\nMailProviderBetaModule.AddServices(builder.Services, builder.Configuration);')

          replace_once(program,
          '''mail.MapPatch("/messages/{accountId:guid}/{messageId}/read", async (IMailGateway gateway, NexoMail.Api.MailReadCache cache, IUserContext userContext, Guid accountId, string messageId, ReadState request, CancellationToken ct) =>
          {
              await gateway.MarkReadAsync(accountId, messageId, request.Read, ct);
              cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity", "message-detail");
              return Results.NoContent();
          });''',
          '''mail.MapPatch("/messages/{accountId:guid}/{messageId}/read", async (IMailGateway gateway, MailIndexMutationService indexMutation, NexoMail.Api.MailReadCache cache, IUserContext userContext, Guid accountId, string messageId, ReadState request, CancellationToken ct) =>
          {
              await gateway.MarkReadAsync(accountId, messageId, request.Read, ct);
              await indexMutation.MarkReadAsync(accountId, messageId, request.Read, ct);
              cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity", "message-detail");
              return Results.NoContent();
          });''')

          replace_once(program,
          '''mail.MapPost("/messages/{accountId:guid}/{messageId}/trash", async (IMailGateway gateway, NexoMail.Api.MailReadCache cache, IUserContext userContext, Guid accountId, string messageId, CancellationToken ct) =>
          {
              await gateway.MoveToTrashAsync(accountId, messageId, ct);
              cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity", "message-detail");
              return Results.NoContent();
          });''',
          '''mail.MapPost("/messages/{accountId:guid}/{messageId}/trash", async (IMailGateway gateway, MailIndexMutationService indexMutation, NexoMail.Api.MailReadCache cache, IUserContext userContext, Guid accountId, string messageId, CancellationToken ct) =>
          {
              await gateway.MoveToTrashAsync(accountId, messageId, ct);
              await indexMutation.MoveAsync(accountId, messageId, "trash", ct);
              cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity", "message-detail");
              return Results.NoContent();
          });''')

          replace_once(program,
          '''mail.MapPost("/messages/{accountId:guid}/{messageId}/move", async (IMailGateway gateway, NexoMail.Api.MailReadCache cache, IUserContext userContext, Guid accountId, string messageId, MoveRequest request, CancellationToken ct) =>
          {
              try
              {
                  await gateway.MoveToFolderAsync(accountId, messageId, request.FolderId.Trim().ToLowerInvariant(), ct);
                  cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity", "message-detail");
                  return Results.NoContent();
              }
              catch (InvalidOperationException exception) { return Results.BadRequest(new { error = exception.Message }); }
              catch (HttpRequestException exception) { return Results.Problem($"El proveedor no pudo mover el correo ({exception.StatusCode?.ToString() ?? "sin código"}).", statusCode: 502); }
          });''',
          '''mail.MapPost("/messages/{accountId:guid}/{messageId}/move", async (IMailGateway gateway, MailIndexMutationService indexMutation, NexoMail.Api.MailReadCache cache, IUserContext userContext, Guid accountId, string messageId, MoveRequest request, CancellationToken ct) =>
          {
              try
              {
                  var folderId = request.FolderId.Trim().ToLowerInvariant();
                  await gateway.MoveToFolderAsync(accountId, messageId, folderId, ct);
                  await indexMutation.MoveAsync(accountId, messageId, folderId, ct);
                  cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity", "message-detail");
                  return Results.NoContent();
              }
              catch (InvalidOperationException exception) { return Results.BadRequest(new { error = exception.Message }); }
              catch (HttpRequestException exception) { return Results.Problem($"El proveedor no pudo mover el correo ({exception.StatusCode?.ToString() ?? "sin código"}).", statusCode: 502); }
          });''')

          replace_once(program,
          '''mail.MapPost("/send", async (IMailGateway gateway, NexoMail.Api.MailReadCache cache, IUserContext userContext, ComposeMessage request, CancellationToken ct) =>
          {
              await gateway.SendAsync(request, ct);
              cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity");
              return Results.Accepted();
          });''',
          '''mail.MapPost("/send", async (IMailGateway gateway, MailIndexMutationService indexMutation, NexoMail.Api.MailReadCache cache, IUserContext userContext, ComposeMessage request, CancellationToken ct) =>
          {
              await gateway.SendAsync(request, ct);
              await indexMutation.MarkAccountForImmediateSyncAsync(request.FromAccountId, ct);
              cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity");
              return Results.Accepted();
          });''')

          replace_once(program,
          '''mail.MapPost("/messages/{accountId:guid}/{messageId}/reply", async (IMailGateway gateway, NexoMail.Api.MailReadCache cache, IUserContext userContext, Guid accountId, string messageId, ReplyRequest request, CancellationToken ct) =>
          {
              await gateway.ReplyAsync(accountId, messageId, request.Message, request.ReplyAll, ct);
              cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity", "message-thread");
              return Results.Accepted();
          });''',
          '''mail.MapPost("/messages/{accountId:guid}/{messageId}/reply", async (IMailGateway gateway, MailIndexMutationService indexMutation, NexoMail.Api.MailReadCache cache, IUserContext userContext, Guid accountId, string messageId, ReplyRequest request, CancellationToken ct) =>
          {
              await gateway.ReplyAsync(accountId, messageId, request.Message, request.ReplyAll, ct);
              await indexMutation.MarkAccountForImmediateSyncAsync(accountId, ct);
              cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "control-center", "control-center-activity", "message-thread");
              return Results.Accepted();
          });''')

          draft = 'src/backend/NexoMail.Api/DraftEndpoints.cs'
          replace_once(draft,
              'using NexoMail.Domain;\n',
              'using NexoMail.Domain;\nusing NexoMail.Infrastructure.Mail;\n')
          replace_once(draft,
          '''        mail.MapPost("/drafts/{accountId:guid}/{draftMessageId}/send", async (
                      IMailGateway gateway,
                      MailReadCache cache,''',
          '''        mail.MapPost("/drafts/{accountId:guid}/{draftMessageId}/send", async (
                      IMailGateway gateway,
                      MailIndexMutationService indexMutation,
                      MailReadCache cache,''')
          replace_once(draft,
          '''                await gateway.SendDraftAsync(accountId, draftMessageId, request, ct);
                          cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "message-detail", "message-thread", "control-center", "control-center-activity");''',
          '''                await gateway.SendDraftAsync(accountId, draftMessageId, request, ct);
                          await indexMutation.MarkAccountForImmediateSyncAsync(accountId, ct);
                          cache.InvalidateAreas(userContext.UserId.ToString(), "messages", "message-detail", "message-thread", "control-center", "control-center-activity");''')
          PY
      - name: Verify provider-first ordering contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/backend/NexoMail.Api/Program.cs').read_text(encoding='utf-8')
          d = Path('src/backend/NexoMail.Api/DraftEndpoints.cs').read_text(encoding='utf-8')
          checks = [
              ('read', p, 'await gateway.MarkReadAsync(accountId, messageId, request.Read, ct);', 'await indexMutation.MarkReadAsync(accountId, messageId, request.Read, ct);'),
              ('trash', p, 'await gateway.MoveToTrashAsync(accountId, messageId, ct);', 'await indexMutation.MoveAsync(accountId, messageId, "trash", ct);'),
              ('move', p, 'await gateway.MoveToFolderAsync(accountId, messageId, folderId, ct);', 'await indexMutation.MoveAsync(accountId, messageId, folderId, ct);'),
              ('send', p, 'await gateway.SendAsync(request, ct);', 'await indexMutation.MarkAccountForImmediateSyncAsync(request.FromAccountId, ct);'),
              ('reply', p, 'await gateway.ReplyAsync(accountId, messageId, request.Message, request.ReplyAll, ct);', 'await indexMutation.MarkAccountForImmediateSyncAsync(accountId, ct);'),
              ('draft-send', d, 'await gateway.SendDraftAsync(accountId, draftMessageId, request, ct);', 'await indexMutation.MarkAccountForImmediateSyncAsync(accountId, ct);'),
          ]
          for name, text, provider, local in checks:
              a = text.find(provider)
              b = text.find(local, a + len(provider)) if a >= 0 else -1
              if a < 0 or b < 0 or b <= a:
                  raise SystemExit(f'provider-first contract failed: {name}')
          print('PASS: provider mutation precedes local index convergence')
          PY
      - name: Restore unified inbox smoke
        run: dotnet restore src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj
      - name: Build unified inbox smoke
        run: dotnet build src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release --no-restore
      - name: Run unified inbox smoke
        run: dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release --no-build
      - name: Restore solution
        run: dotnet restore NexoMail.sln
      - name: Build solution
        run: dotnet build NexoMail.sln --configuration Release --no-restore
      - name: Publish Task 6 product wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/backend/NexoMail.Api/Program.cs src/backend/NexoMail.Api/DraftEndpoints.cs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: converge mail index after provider mutations'
          git push origin HEAD:feature/unified-inbox-source-of-truth
