name: Fix large mailbox backfill and readiness UX

on:
  push:
    branches:
      - feature/unified-inbox-source-of-truth
    paths:
      - .github/workflows/fix-large-mailbox-backfill.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-inbox-source-of-truth
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Write failing regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backfill = Path('src/backend/NexoMail.UnifiedInboxSmokeTests/GmailBackfillSmoke.cs')
          text = backfill.read_text(encoding='utf-8')
          start = text.index('        await service.SyncForUserAsync(userId, 90, 25, ct);')
          end = text.index('    private static Task<int> IndexedCount', start)
          replacement = '''        await service.SyncForUserAsync(userId, 90, 25, ct);\n        database.ChangeTracker.Clear();\n        var state1 = await database.MailIndexStates.AsNoTracking().SingleAsync(x => x.AccountId == accountId, ct);\n        EnsureBackfill(state1.BackfillStartedAt is not null, "El ciclo debe registrar el inicio del backfill completo.");\n        EnsureBackfill(state1.BackfillCompletedAt is null, "El primer ciclo debe respetar el tope de páginas y conservar el backfill incompleto cuando aún queda historial.");\n        EnsureBackfill(state1.BackfillPageToken == "p6", "Un solo ciclo debe consumir cinco páginas y persistir el token de la sexta.");\n        EnsureBackfill(state1.GmailHistoryId is null, "No debe capturarse History mientras queden páginas pendientes.");\n        EnsureBackfill(await IndexedCount(database, userId, accountId, ct) == 125, "El primer ciclo debe indexar cinco páginas de 25 mensajes.");\n        EnsureBackfill(factory.FullBackfillListCalls == 5, "El primer ciclo debe consumir exactamente cinco páginas de backfill.");\n        EnsureBackfill(factory.ProfileCalls == 0, "No debe capturarse el perfil antes de terminar el backfill.");\n        EnsureBackfill(factory.HistoryListCalls == 0, "History no debe ejecutarse mientras el backfill siga incompleto.");\n\n        await service.SyncForUserAsync(userId, 90, 25, ct);\n        database.ChangeTracker.Clear();\n        var state2 = await database.MailIndexStates.AsNoTracking().SingleAsync(x => x.AccountId == accountId, ct);\n        EnsureBackfill(state2.BackfillCompletedAt is not null, "El segundo ciclo debe completar las páginas restantes.");\n        EnsureBackfill(state2.BackfillPageToken is null, "Al completar el backfill no debe quedar page token pendiente.");\n        EnsureBackfill(state2.GmailHistoryId == "500", "Al completar el backfill debe persistirse un checkpoint History fresco.");\n\n        var indexedIds = (await database.MailMessageIndex\n                .AsNoTracking()\n                .Where(x => x.UserId == userId && x.AccountId == accountId)\n                .Select(x => x.ProviderMessageId)\n                .ToArrayAsync(ct))\n            .ToHashSet(StringComparer.Ordinal);\n        EnsureBackfill(indexedIds.SetEquals(factory.AllProviderIds), "El backfill completo debe contener exactamente todos los IDs del proveedor.");\n        EnsureBackfill(await IndexedCount(database, userId, accountId, ct) == 175, "Los dos ciclos deben acumular los 175 mensajes sin duplicados.");\n        EnsureBackfill(factory.FullBackfillListCalls == 7, "El escenario debe consumir exactamente siete páginas del proveedor.");\n        EnsureBackfill(factory.ProfileCalls == 1, "El checkpoint History debe capturarse una sola vez al completar el backfill.");\n        EnsureBackfill(factory.HistoryListCalls == 1, "History debe reproducirse una sola vez tras completar el backfill.");\n    }\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('private readonly string[] _allProviderIds = Enumerable.Range(1, 60).Select(i => $"bf-{i:00}").ToArray();',
                              'private readonly string[] _allProviderIds = Enumerable.Range(1, 175).Select(i => $"bf-{i:000}").ToArray();')
          old = '''            FullBackfillListCalls++;\n            var token = QueryValue(request.RequestUri!, "pageToken");\n            return Task.FromResult(token switch\n            {\n                null => MessagePage(_allProviderIds[..25], "p2"),\n                "p2" => MessagePage(_allProviderIds[25..50], "p3"),\n                "p3" => MessagePage(_allProviderIds[50..], null),\n                _ => Json(HttpStatusCode.BadRequest, "{\\\"error\\\":\\\"unexpected_page_token\\\"}"),\n            });\n'''
          new = '''            FullBackfillListCalls++;\n            var token = QueryValue(request.RequestUri!, "pageToken");\n            var pageNumber = token is null ? 1 : int.TryParse(token.TrimStart('p'), out var parsed) ? parsed : -1;\n            if (pageNumber < 1)\n                return Task.FromResult(Json(HttpStatusCode.BadRequest, "{\\\"error\\\":\\\"unexpected_page_token\\\"}"));\n            var start = (pageNumber - 1) * 25;\n            if (start >= _allProviderIds.Length)\n                return Task.FromResult(Json(HttpStatusCode.BadRequest, "{\\\"error\\\":\\\"page_out_of_range\\\"}"));\n            var ids = _allProviderIds.Skip(start).Take(25).ToArray();\n            var next = start + ids.Length < _allProviderIds.Length ? $"p{pageNumber + 1}" : null;\n            return Task.FromResult(MessagePage(ids, next));\n'''
          if old not in text:
              raise SystemExit('No se encontró el switch paginado del smoke de backfill.')
          text = text.replace(old, new, 1)
          backfill.write_text(text, encoding='utf-8')

          smoke = Path('src/frontend/scripts/unified-inbox-readiness-smoke.mjs')
          smoke.write_text('''import { readFile } from 'node:fs/promises'\n\nasync function source(path) {\n  return readFile(new URL(`../${path}`, import.meta.url), 'utf8')\n}\n\nfunction ensure(condition, message) {\n  if (!condition) throw new Error(message)\n}\n\nconst [mailApi, inbox] = await Promise.all([\n  source('src/api/mailApi.ts'),\n  source('src/pages/InboxPage.tsx'),\n])\n\nensure(mailApi.includes('export class MailApiError') && mailApi.includes('readonly status') && mailApi.includes('readonly problem'),\n  'mailApi debe conservar status y payload estructurado de errores HTTP.')\nensure(mailApi.includes('export function unifiedInboxReadiness') && mailApi.includes('gmailAccountStates'),\n  'mailApi debe reconocer explícitamente el 409 de readiness de la Bandeja Unificada.')\nensure(inbox.includes('retry: (failureCount, error) => !unifiedInboxReadiness(error)') && inbox.includes('refetchInterval: query => unifiedInboxReadiness(query.state.error)'),\n  'Inbox no debe reintentar rápidamente un 409 de readiness y debe comprobar el progreso de forma periódica.')\nensure(inbox.includes('Sincronizando historial') && inbox.includes('Comprobar estado') && inbox.includes('indexedMessageCount'),\n  'Inbox debe mostrar el progreso de sincronización por cuenta en lugar del error genérico.')\nensure(inbox.includes('!readinessProblem && displayItems.length === 0'),\n  'Inbox no debe mostrar un estado vacío mientras el índice todavía se está preparando.')\n\nconsole.log('PASS: Unified Inbox trata readiness como sincronización en progreso')\n''', encoding='utf-8')
          PY

      - name: Verify backend RED
        shell: bash
        run: |
          set +e
          dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release > /tmp/backend-red.log 2>&1
          status=$?
          set -e
          cat /tmp/backend-red.log
          if [ "$status" -eq 0 ]; then
            echo 'El smoke backend debía fallar antes de implementar el procesamiento multipágina.'
            exit 1
          fi
          grep -q 'Un solo ciclo debe consumir cinco páginas' /tmp/backend-red.log

      - name: Verify frontend RED
        shell: bash
        run: |
          set +e
          node src/frontend/scripts/unified-inbox-readiness-smoke.mjs > /tmp/frontend-red.log 2>&1
          status=$?
          set -e
          cat /tmp/frontend-red.log
          if [ "$status" -eq 0 ]; then
            echo 'El smoke frontend debía fallar antes de implementar readiness estructurado.'
            exit 1
          fi
          grep -q 'mailApi debe conservar status' /tmp/frontend-red.log

      - name: Implement bounded multipage backfill and readiness UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/backend/NexoMail.Infrastructure/Google/GmailMetadataIndexService.cs')
          text = service.read_text(encoding='utf-8')
          anchor = '    private const int GmailHistoryPageMaximum = 500;\n'
          if 'MaximumFullBackfillPagesPerSync' not in text:
              if anchor not in text:
                  raise SystemExit('No se encontró constante GmailHistoryPageMaximum.')
              text = text.replace(anchor, anchor + '    private const int MaximumFullBackfillPagesPerSync = 5;\n', 1)

          old_call = '''                var backfill = await ProcessFullBackfillPageAsync(\n                    account,\n                    userId,\n                    client,\n                    Math.Min(limitPerAccount, GmailListPageMaximum),\n                    now,\n                    days,\n                    cancellationToken);\n'''
          new_call = '''                var backfill = await ProcessFullBackfillPagesAsync(\n                    account,\n                    userId,\n                    client,\n                    Math.Min(limitPerAccount, GmailListPageMaximum),\n                    leaseOwner,\n                    now,\n                    days,\n                    cancellationToken);\n'''
          if old_call not in text:
              raise SystemExit('No se encontró llamada ProcessFullBackfillPageAsync.')
          text = text.replace(old_call, new_call, 1)

          release_marker = '    private async Task ReleaseLeaseAsync(Guid accountId, string owner, CancellationToken cancellationToken)\n'
          renew = '''    private async Task<bool> RenewLeaseAsync(Guid accountId, string owner, CancellationToken cancellationToken)\n    {\n        var now = DateTimeOffset.UtcNow;\n        var affected = await database.MailIndexStates\n            .Where(x => x.AccountId == accountId && x.SyncLeaseOwner == owner)\n            .ExecuteUpdateAsync(setters => setters\n                .SetProperty(x => x.SyncLeaseUntil, now.Add(SyncLeaseDuration)), cancellationToken);\n        return affected == 1;\n    }\n\n'''
          if release_marker not in text:
              raise SystemExit('No se encontró ReleaseLeaseAsync.')
          if 'private async Task<bool> RenewLeaseAsync' not in text:
              text = text.replace(release_marker, renew + release_marker, 1)

          start = text.index('    private async Task<(int Messages, int Attachments)> ProcessFullBackfillPageAsync(')
          end = text.index('    private async Task<(int Messages, int Attachments)> ProcessHistoryChangesAsync(', start)
          method = '''    private async Task<(int Messages, int Attachments)> ProcessFullBackfillPagesAsync(\n        MailAccountEntity account,\n        Guid userId,\n        HttpClient client,\n        int pageSize,\n        string leaseOwner,\n        DateTimeOffset now,\n        int days,\n        CancellationToken cancellationToken)\n    {\n        var state = await database.MailIndexStates\n            .SingleAsync(x => x.AccountId == account.Id && x.UserId == userId, cancellationToken);\n        if (state.BackfillCompletedAt.HasValue) return (0, 0);\n\n        if (!state.BackfillStartedAt.HasValue)\n        {\n            state.BackfillStartedAt = now;\n            state.GmailHistoryId = null;\n            await database.SaveChangesAsync(cancellationToken);\n        }\n        else if (!string.IsNullOrWhiteSpace(state.GmailHistoryId))\n        {\n            // Older builds persisted a History checkpoint at backfill start. It is not safe\n            // to reuse after a multi-cycle backfill because Gmail may expire it meanwhile.\n            state.GmailHistoryId = null;\n            await database.SaveChangesAsync(cancellationToken);\n        }\n\n        var totalMessages = 0;\n        var totalAttachments = 0;\n\n        for (var pageNumber = 0; pageNumber < MaximumFullBackfillPagesPerSync; pageNumber++)\n        {\n            state = await database.MailIndexStates\n                .SingleAsync(x => x.AccountId == account.Id && x.UserId == userId, cancellationToken);\n            if (state.BackfillCompletedAt.HasValue) break;\n\n            var page = await ListFullBackfillPageAsync(client, pageSize, state.BackfillPageToken, cancellationToken);\n            var indexed = await LoadMetadataAsync(client, page.MessageIds, cancellationToken);\n            if (indexed.Count != page.MessageIds.Count)\n                throw new HttpRequestException($"El backfill Gmail no pudo cargar todos los metadatos de la página ({indexed.Count}/{page.MessageIds.Count}); el checkpoint no avanzará.");\n\n            if (indexed.Count > 0)\n                await UpsertAccountIndexAsync(account, userId, indexed, now, days, cancellationToken);\n\n            state = await database.MailIndexStates\n                .SingleAsync(x => x.AccountId == account.Id && x.UserId == userId, cancellationToken);\n            state.BackfillStartedAt ??= now;\n            state.BackfillPageToken = page.NextPageToken;\n            if (string.IsNullOrWhiteSpace(page.NextPageToken))\n            {\n                // Capture a fresh checkpoint only when the complete provider-visible mailbox\n                // has been indexed, so the incremental History phase cannot start from a stale id.\n                state.GmailHistoryId = await GetProfileHistoryIdAsync(client, cancellationToken);\n                state.BackfillCompletedAt = DateTimeOffset.UtcNow;\n            }\n            await database.SaveChangesAsync(cancellationToken);\n\n            totalMessages += indexed.Count;\n            totalAttachments += indexed.Sum(x => x.Attachments.Count);\n\n            if (string.IsNullOrWhiteSpace(page.NextPageToken)) break;\n            if (!await RenewLeaseAsync(account.Id, leaseOwner, cancellationToken))\n                throw new InvalidOperationException("Se perdió el lease de sincronización Gmail durante el backfill; el ciclo se detendrá para evitar procesamiento concurrente.");\n        }\n\n        return (totalMessages, totalAttachments);\n    }\n\n'''
          text = text[:start] + method + text[end:]
          service.write_text(text, encoding='utf-8')

          api = Path('src/frontend/src/api/mailApi.ts')
          text = api.read_text(encoding='utf-8')
          insert_anchor = "const messageAttachmentCache = new Map<string, MailAttachment[]>()\n"
          definitions = '''export type UnifiedInboxAccountReadiness = {\n  accountId: string\n  displayName: string\n  emailAddress: string\n  backfillStartedAt?: string | null\n  backfillCompletedAt?: string | null\n  hasBackfillPageToken: boolean\n  hasGmailHistoryId: boolean\n  lastSyncAttemptAt?: string | null\n  lastSyncErrorCode?: string | null\n  indexedMessageCount: number\n  syncLeaseUntil?: string | null\n}\n\nexport type UnifiedInboxReadinessProblem = {\n  error?: string\n  incompleteAccountIds: string[]\n  unsupportedProviderAccountIds: string[]\n  gmailAccountStates: UnifiedInboxAccountReadiness[]\n}\n\nexport class MailApiError extends Error {\n  constructor(message: string, public readonly status: number, public readonly problem: unknown) {\n    super(message)\n    this.name = 'MailApiError'\n  }\n}\n\nexport function unifiedInboxReadiness(error: unknown): UnifiedInboxReadinessProblem | null {\n  if (!(error instanceof MailApiError) || error.status !== 409) return null\n  const problem = error.problem as UnifiedInboxReadinessProblem | null\n  if (!problem || !Array.isArray(problem.incompleteAccountIds) || !Array.isArray(problem.gmailAccountStates)) return null\n  return problem\n}\n\n'''
          if 'export class MailApiError' not in text:
              if insert_anchor not in text:
                  raise SystemExit('No se encontró ancla mailApi.')
              text = text.replace(insert_anchor, definitions + insert_anchor, 1)
          old_error = '''  if (!response.ok) {\n    const problem = await response.json().catch(() => null) as { detail?: string; error?: string } | null\n    throw new Error(problem?.detail ?? problem?.error ?? 'No fue posible completar la operación.')\n  }\n'''
          new_error = '''  if (!response.ok) {\n    const problem = await response.json().catch(() => null) as ({ detail?: string; error?: string } & Record<string, unknown>) | null\n    throw new MailApiError(problem?.detail ?? problem?.error ?? 'No fue posible completar la operación.', response.status, problem)\n  }\n'''
          if old_error not in text:
              raise SystemExit('No se encontró manejo genérico de error mailApi.')
          text = text.replace(old_error, new_error, 1)
          api.write_text(text, encoding='utf-8')

          inbox = Path('src/frontend/src/pages/InboxPage.tsx')
          text = inbox.read_text(encoding='utf-8')
          text = text.replace("import { mailApi } from '../api/mailApi'", "import { mailApi, unifiedInboxReadiness } from '../api/mailApi'", 1)
          old_query = '''    refetchInterval: 10 * 60_000,\n    refetchIntervalInBackground: false,\n'''
          new_query = '''    retry: (failureCount, error) => !unifiedInboxReadiness(error) && failureCount < 2,\n    refetchInterval: query => unifiedInboxReadiness(query.state.error) ? 30_000 : 10 * 60_000,\n    refetchIntervalInBackground: false,\n'''
          if old_query not in text:
              raise SystemExit('No se encontró configuración messagesQuery.')
          text = text.replace(old_query, new_query, 1)
          old_state = '''  const priorityLoading = priorityOnly && (prioritySnapshot.isLoading || trackedItemsQuery.isLoading)\n  const priorityError = priorityOnly && (prioritySnapshot.isError || trackedItemsQuery.isError)\n  const listLoading = priorityOnly ? priorityLoading : messagesQuery.isLoading\n  const listError = priorityOnly ? priorityError : messagesQuery.isError\n'''
          new_state = '''  const priorityLoading = priorityOnly && (prioritySnapshot.isLoading || trackedItemsQuery.isLoading)\n  const priorityError = priorityOnly && (prioritySnapshot.isError || trackedItemsQuery.isError)\n  const readinessProblem = priorityOnly ? null : unifiedInboxReadiness(messagesQuery.error)\n  const readinessAccounts = readinessProblem?.gmailAccountStates\n    .filter(state => readinessProblem.incompleteAccountIds.includes(state.accountId)) ?? []\n  const readinessSummary = readinessAccounts\n    .map(state => `${state.displayName} (${state.indexedMessageCount.toLocaleString('es-CL')} indexados)`)\n    .join(', ')\n  const listLoading = priorityOnly ? priorityLoading : messagesQuery.isLoading\n  const listError = priorityOnly ? priorityError : messagesQuery.isError && !readinessProblem\n'''
          if old_state not in text:
              raise SystemExit('No se encontró bloque de estado Inbox.')
          text = text.replace(old_state, new_state, 1)
          old_render = '''    {listLoading && <section className="inbox-mail-loading" aria-label="Cargando correos"><div className="inbox-loading-heading"><strong>{priorityOnly ? 'Recuperando seguimiento' : 'Cargando correos'}</strong><span>{priorityOnly ? 'Consultando pendientes y seguimientos manuales.' : 'Actualizando la bandeja.'}</span></div><MailSkeleton /></section>}\n    {listError && <div className="notice">{priorityOnly ? 'No fue posible recuperar el seguimiento prioritario.' : 'No se pudo actualizar una de sus cuentas.'} <button onClick={() => priorityOnly ? void Promise.all([prioritySnapshot.refetch(), trackedItemsQuery.refetch()]) : void messagesQuery.refetch()}>Reintentar</button></div>}\n    {!listLoading && !listError && displayItems.length === 0 && <NexiEmptyState title={emptyTitle} description={emptyDescription} action={emptyAction} />}\n'''
          new_render = '''    {listLoading && <section className="inbox-mail-loading" aria-label="Cargando correos"><div className="inbox-loading-heading"><strong>{priorityOnly ? 'Recuperando seguimiento' : 'Cargando correos'}</strong><span>{priorityOnly ? 'Consultando pendientes y seguimientos manuales.' : 'Actualizando la bandeja.'}</span></div><MailSkeleton /></section>}\n    {readinessProblem && <div className="notice" role="status"><span><strong>Sincronizando historial.</strong> {readinessSummary ? `${readinessSummary}. ` : ''}La Bandeja Unificada se habilitará automáticamente al completar el índice.</span> <button disabled={messagesQuery.isFetching} onClick={() => void messagesQuery.refetch()}>{messagesQuery.isFetching ? 'Comprobando…' : 'Comprobar estado'}</button></div>}\n    {listError && <div className="notice">{priorityOnly ? 'No fue posible recuperar el seguimiento prioritario.' : 'No se pudo actualizar una de sus cuentas.'} <button onClick={() => priorityOnly ? void Promise.all([prioritySnapshot.refetch(), trackedItemsQuery.refetch()]) : void messagesQuery.refetch()}>Reintentar</button></div>}\n    {!listLoading && !listError && !readinessProblem && displayItems.length === 0 && <NexiEmptyState title={emptyTitle} description={emptyDescription} action={emptyAction} />}\n'''
          if old_render not in text:
              raise SystemExit('No se encontró bloque de error/render Inbox.')
          text = text.replace(old_render, new_render, 1)
          inbox.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/frontend-build.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '''      - name: Verify commercial feature gates\n        run: node scripts/commercial-entitlement-smoke.mjs\n'''
          readiness_step = '''      - name: Verify Unified Inbox readiness handling\n        run: node scripts/unified-inbox-readiness-smoke.mjs\n\n'''
          if readiness_step not in text:
              if marker not in text:
                  raise SystemExit('No se encontró marker frontend-build.')
              text = text.replace(marker, readiness_step + marker, 1)
          workflow.write_text(text, encoding='utf-8')
          PY

      - name: Restore Unified Inbox smoke
        run: dotnet restore src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj

      - name: Verify backend GREEN
        run: dotnet run --project src/backend/NexoMail.UnifiedInboxSmokeTests/NexoMail.UnifiedInboxSmokeTests.csproj --configuration Release

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Verify frontend GREEN
        working-directory: src/frontend
        run: node scripts/unified-inbox-readiness-smoke.mjs

      - name: Build frontend
        working-directory: src/frontend
        run: pnpm build

      - name: Restore solution
        run: dotnet restore NexoMail.sln

      - name: Build solution
        run: dotnet build NexoMail.sln --configuration Release --no-restore

      - name: Run Control Center smoke
        run: dotnet run --project src/backend/NexoMail.ControlCenterSmokeTests/NexoMail.ControlCenterSmokeTests.csproj --configuration Release

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/NexoMail.Infrastructure/Google/GmailMetadataIndexService.cs \
                  src/backend/NexoMail.UnifiedInboxSmokeTests/GmailBackfillSmoke.cs \
                  src/frontend/src/api/mailApi.ts \
                  src/frontend/src/pages/InboxPage.tsx \
                  src/frontend/scripts/unified-inbox-readiness-smoke.mjs \
                  .github/workflows/frontend-build.yml
          git commit -m "fix: accelerate Gmail backfill and surface readiness progress"
          git push origin HEAD:feature/unified-inbox-source-of-truth
